		<!-- Dark mode (design.md 9.1). Two theme-colors so iOS tints the status
		     bar to match the active theme; one value could only ever match one. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F1" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121614" />

		<!-- Theme before first paint, so a reload never flashes light in dark
		     mode. Settings stores "light" or "dark" under this key; anything
		     else is "auto", the phone's setting. #lib/theme.svelte.ts takes
		     over once the app runs — keep the key and colours in step. -->
		<script>
			(function () {
				var pref = null;
				try {
					pref = localStorage.getItem('water-it-theme');
				} catch (e) {}
				var dark =
					pref === 'dark' ||
					(pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				// Language on "auto" (#lib/i18n/language.ts): Paraglide saves
				// whatever it resolved on first use, which would pin the phone's
				// language of that day. Clearing it before the app starts makes it
				// follow the phone again on every launch.
				try {
					if (!localStorage.getItem('water-it-language')) {
						localStorage.removeItem('PARAGLIDE_LOCALE');
					}
				} catch (e) {}
				if (pref === 'light' || pref === 'dark') {
					var metas = document.querySelectorAll('meta[name="theme-color"]');
					for (var i = 0; i < metas.length; i++) {
						metas[i].content = dark ? '#121614' : '#F3F5F1';
					}
				}
			})();
		</script>

		<style>
			@property --splash-r {
				syntax: '<length>';
				inherits: false;
				initial-value: -2px;
			}
			#splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				background: #316c4d;
				--splash-r: -2px;
				--splash-y: 0px;
				-webkit-mask-image: radial-gradient(
					circle at 50% calc(50% + var(--splash-y)),
					transparent var(--splash-r),
					#000 calc(var(--splash-r) + 1px)
				);
				mask-image: radial-gradient(
					circle at 50% calc(50% + var(--splash-y)),
					transparent var(--splash-r),
					#000 calc(var(--splash-r) + 1px)
				);
			}
			#splash .splash-logo {
				position: absolute;
				left: 50%;
				top: calc(50% + var(--splash-y));
				width: var(--splash-size, 65vmin);
				height: var(--splash-size, 65vmin);
				translate: -50% -50%;
			}
			#splash svg {
				display: block;
				width: 100%;
				height: 100%;
			}
			#splash .splash-ring {
				position: absolute;
				inset: 30%;
				border: 2px solid #f8f7f4;
				border-radius: 50%;
				opacity: 0;
			}
			#splash.play svg {
				animation: splash-pulse 0.45s 0.08s both;
			}
			#splash.play .splash-ring {
				animation: splash-ring 0.6s 0.28s both;
			}
			#splash.play .splash-ring + .splash-ring {
				animation: splash-ring-2 0.65s 0.42s both;
			}
			#splash.out {
				pointer-events: none;
				transition:
					--splash-r 0.6s cubic-bezier(0.6, 0, 0.4, 1),
					opacity 0.15s 0.5s;
				--splash-r: 150vmax;
				opacity: 0;
			}
			#splash.out .splash-logo {
				transition:
					scale 0.4s ease-in,
					opacity 0.3s;
				scale: 1.5;
				opacity: 0;
			}
			@keyframes splash-pulse {
				0% {
					scale: 1;
				}
				27% {
					scale: 0.9;
				}
				58% {
					scale: 1.06;
				}
				100% {
					scale: 1;
				}
			}
			@keyframes splash-ring {
				0% {
					scale: 0.7;
					opacity: 0;
				}
				10% {
					opacity: 0.7;
				}
				100% {
					scale: 2.6;
					opacity: 0;
				}
			}
			@keyframes splash-ring-2 {
				0% {
					scale: 0.7;
					opacity: 0;
				}
				10% {
					opacity: 0.5;
				}
				100% {
					scale: 3.2;
					opacity: 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash.out {
					transition: opacity 0.25s;
					--splash-r: -2px;
				}
				#splash.out .splash-logo {
					transition: none;
					scale: 1;
					opacity: 1;
				}
			}
