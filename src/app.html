<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so the layout can reach under the notch and home
		     indicator; screens use env(safe-area-inset-*) for real padding. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- Dark mode (design.md 9.1). Two theme-colors so iOS tints the status
		     bar to match the active theme; one value could only ever match one. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F1" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121614" />

		<!-- Theme before first paint, so a reload never flashes light in dark
		     mode. Settings stores "light" or "dark" under this key; anything
		     else is "auto", the phone's setting. #lib/theme.svelte.ts takes
		     over once the app runs — keep the key and colours in step. -->
		<script>
			(function () {
				var pref = null;
				try {
					pref = localStorage.getItem('water-it-theme');
				} catch (e) {}
				var dark =
					pref === 'dark' ||
					(pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				// Language on "auto" (#lib/i18n/language.ts): Paraglide saves
				// whatever it resolved on first use, which would pin the phone's
				// language of that day. Clearing it before the app starts makes it
				// follow the phone again on every launch.
				try {
					if (!localStorage.getItem('water-it-language')) {
						localStorage.removeItem('PARAGLIDE_LOCALE');
					}
				} catch (e) {}
				if (pref === 'light' || pref === 'dark') {
					var metas = document.querySelectorAll('meta[name="theme-color"]');
					for (var i = 0; i < metas.length; i++) {
						metas[i].content = dark ? '#121614' : '#F3F5F1';
					}
				}
			})();
		</script>

		<!-- Installed app on the Home Screen. `apple-mobile-web-app-capable` is
		     the deprecated spelling but still the one iOS honours, so both. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Water.it" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!-- Generated from static/app-icon.svg by pwa-assets.config.ts. -->
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
