<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today — tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6B4F}a:hover{color:#1F4A36}
button{font-family:inherit}
input::placeholder{color:#5A665F}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; display: flex; background: #F3F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B241F; overflow: hidden">

  <nav aria-label="Main" style="width: 96px; flex: none; box-sizing: border-box; padding: 28px 0; background: #FFFFFF; border-right: 1px solid #E1E6E2; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <div role="img" aria-label="Water.it" style="width: 48px; height: 48px; border-radius: 14px; background: #2F6B4F; display: flex; align-items: center; justify-content: center; margin-bottom: 16px">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" fill="#F7F7F2"></path><path d="M12 19v-5M12 16c-1.8 0-3-1.2-3-3 1.8 0 3 1.2 3 3zM12 15.5c1.8 0 3-1.2 3-3-1.8 0-3 1.2-3 3z" stroke="#2F6B4F" stroke-width="1.3" fill="#2F6B4F" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <a href="TabletToday.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; justify-content: center; text-decoration: none; color: #2F6B4F; font-size: 12px; font-weight: 700">
      <span style="width: 56px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #DCEBDD"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg></span>Today
    </a>
    <a href="TabletPlants.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; justify-content: center; text-decoration: none; color: #5A665F; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg></span>Plants
    </a>
    <a href="TabletPlants.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; justify-content: center; text-decoration: none; color: #5A665F; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg></span>Photos
    </a>
    <a href="TabletPlants.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; justify-content: center; text-decoration: none; color: #5A665F; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>Settings
    </a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 40px 32px 32px; display: flex; gap: 24px">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; font-weight: 600; color: #5A665F; letter-spacing: 0.02em">Wednesday 11 November</div>
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Today</h1>
        <div style="font-size: 15px; color: #45514A">{{summary}}</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start">
        <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 12px 12px 14px; border: 2px solid {{item.borderC}}; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(20,40,30,0.06)">
          <div style="display: flex; gap: 10px; align-items: center">
            <div style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: {{item.tint}}; display: flex; align-items: center; justify-content: center; color: #2F6B4F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg></div>
            <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <div style="font-size: 16px; font-weight: 700">{{item.name}}</div>
              <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{item.dueFg}}">
                <sc-if value="{{item.overdue}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></sc-if>
                <span>{{item.due}}</span>
              </div>
            </div>
          </div>
          <sc-if value="{{item.open}}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 13px; line-height: 1.4; color: #2E3933">{{item.hint}}</div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
              <div style="display: flex; align-items: center; gap: 4px">
              <button type="button" onClick="{{item.damp}}" style="min-height: 40px; padding: 0 12px; border: 1.5px solid #C9D3CC; border-radius: 10px; background: #FFFFFF; color: #1B241F; font-size: 13px; font-weight: 600; cursor: pointer">Still damp</button>
              <button type="button" onClick="{{item.skip}}" style="min-height: 40px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; color: #45514A; font-size: 13px; font-weight: 600; cursor: pointer">Skip</button>
              </div>
              <button type="button" onClick="{{item.water}}" aria-label="Watered {{item.name}}" style="flex: none; min-height: 48px; padding: 0 20px 0 16px; border: none; border-radius: 12px; background: #2B5F9E; color: #FFFFFF; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg>Watered</button>
            </div>
          </sc-if>
          <sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 48px">
              <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: {{item.sBg}}; color: {{item.sFg}}; font-size: 13px; font-weight: 700">
                <sc-if value="{{item.isWater}}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                <sc-if value="{{item.isDamp}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></sc-if>
                <sc-if value="{{item.isSkip}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></sc-if>
                {{item.sLabel}}</span>
              <span style="font-size: 13px; color: #45514A">{{item.sNext}}</span>
              <button type="button" onClick="{{item.undo}}" style="margin-left: auto; min-height: 44px; padding: 0 8px; border: none; background: transparent; color: #1B241F; font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer">Undo</button>
            </div>
          </sc-if>
        </div>
        </sc-for>
      </div>
    </div>
    <aside aria-label="Coming up" style="width: 300px; flex: none; display: flex; flex-direction: column; gap: 12px; padding-top: 88px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #5A665F">Coming up</h2>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 16px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(20,40,30,0.06)">
          <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="3">
            <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E8ECE8">
              <div style="width: 44px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; background: #F3F5F1; padding: 6px 0">
                <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #5A665F">{{u.dow}}</span>
                <span style="font-size: 18px; font-weight: 800; color: #1B241F">{{u.day}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px; justify-content: center; min-width: 0">
                <span style="font-size: 15px; font-weight: 700">{{u.plant}}</span>
                <span style="font-size: 13px; color: #45514A">{{u.task}}</span>
              </div>
            </div>
          </sc-for>
        <a href="TabletPlants.dc.html" style="min-height: 48px; display: flex; align-items: center; font-size: 14px; font-weight: 700">See all plants</a>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5A665F">Dates move when you log something. A late watering pushes the next check later.</p>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { logged: {} }; }
  renderVals() {
    var self = this;
    var base = [
      { id: 'pilea', name: 'Pilea', tint: '#DCEBDD', due: 'Overdue 2 days', overdue: true, hint: 'Skewer under the pebbles. Water if dry 2–3 cm down.' },
      { id: 'dracaena', name: 'Dracaena', tint: '#E3E9D5', due: 'Today', overdue: false, hint: 'Keep lightly moist while rooting. Never soggy.' },
      { id: 'yucca', name: 'Yucca', tint: '#E8E6D6', due: 'Today', overdue: false, hint: 'Lift the pot. If it feels light, water until the saucer fills.' },
      { id: 'crassula', name: 'Crassula', tint: '#E4ECD9', due: 'Today', overdue: false, hint: 'Only water when the soil is fully dry.' }
    ];
    var ST = {
      water: { label: 'Watered', next: 'Next check in 14 days', bg: '#DDF0E2', fg: '#1F5A36' },
      damp: { label: 'Still damp', next: 'Checking again in 3 days', bg: '#FCEFC7', fg: '#6E4B00' },
      skip: { label: 'Skipped', next: 'Back on the list tomorrow', bg: '#FBE1DE', fg: '#9B1C1C' }
    };
    var logged = this.state.logged;
    var items = base.map(function (p) {
      var k = logged[p.id];
      function set(v) { return function () { var n = Object.assign({}, self.state.logged); if (v) { n[p.id] = v; } else { delete n[p.id]; } self.setState({ logged: n }); }; }
      var st = k ? ST[k] : null;
      return Object.assign({}, p, {
        open: !k, done: !!k,
        borderC: (p.overdue && !k) ? '#C53030' : 'transparent',
        dueFg: p.overdue ? '#9B1C1C' : '#1D3E63',
        sLabel: st ? st.label : '', sNext: st ? st.next : '', sBg: st ? st.bg : '#FFFFFF', sFg: st ? st.fg : '#1B241F',
        isWater: k === 'water', isDamp: k === 'damp', isSkip: k === 'skip',
        water: set('water'), damp: set('damp'), skip: set('skip'), undo: set(null)
      });
    });
    var left = items.filter(function (i) { return i.open; }).length;
    return {
      items: items,
      summary: left === 0 ? 'All done for today.' : left + ' to check · tap the drop when watered',
      upcoming: [
        { dow: 'Sun', day: '15', plant: 'Pilea', task: 'Turn the pot' },
        { dow: 'Fri', day: '20', plant: 'Tree aloe', task: 'Check soil' },
        { dow: 'Wed', day: '25', plant: 'Dracaena', task: 'Check soil' }
      ]
    };
  }
}
</script>
</body>
</html>
