<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6B4F}a:hover{color:#1F4A36}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; position: relative; background: #F3F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B241F; overflow: hidden">
  <div style="padding: 56px 20px 120px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600; color: #5A665F; letter-spacing: 0.02em">Wednesday 11 November</div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Today</h1>
      <div style="font-size: 15px; color: #45514A">{{summary}}</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 10px; border: 2px solid {{item.borderC}}; display: flex; gap: 12px; align-items: stretch; box-shadow: 0 1px 2px rgba(20,40,30,0.06)">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; gap: 10px; align-items: center">
              <div style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: {{item.tint}}; display: flex; align-items: center; justify-content: center; color: #2F6B4F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg></div>
              <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
                <div style="font-size: 16px; font-weight: 700">{{item.name}}</div>
                <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{item.dueFg}}">
                  <sc-if value="{{item.overdue}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></sc-if>
                  <span>{{item.due}}</span>
                </div>
              </div>
            </div>
            <sc-if value="{{item.open}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="font-size: 13px; line-height: 1.4; color: #2E3933">{{item.hint}}</div>
                <div style="display: flex; gap: 4px">
                  <button type="button" onClick="{{item.damp}}" style="min-height: 36px; padding: 0 12px; border: 1.5px solid #C9D3CC; border-radius: 10px; background: #FFFFFF; color: #1B241F; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Still damp</button>
                  <button type="button" onClick="{{item.skip}}" style="min-height: 36px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; color: #45514A; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Skip</button>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: {{item.sBg}}; color: {{item.sFg}}; font-size: 13px; font-weight: 700">{{item.sLabel}}</span>
                <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #45514A">
                  <span>{{item.sNext}}</span>
                  <button type="button" onClick="{{item.undo}}" style="min-height: 36px; border: none; background: transparent; color: #1B241F; font-family: inherit; font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer">Undo</button>
                </div>
              </div>
            </sc-if>
          </div>
          <sc-if value="{{item.open}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{item.water}}" aria-label="Watered {{item.name}}" style="width: 84px; flex: none; min-height: 84px; border: none; border-radius: 18px; background: #2B5F9E; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg><span>Watered</span></button>
          </sc-if>
          <sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
            <div style="width: 84px; flex: none; min-height: 84px; border-radius: 18px; background: {{item.sBg}}; color: {{item.sFg}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{item.isWater}}" hint-placeholder-val="{{ true }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
              <sc-if value="{{item.isDamp}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></sc-if>
              <sc-if value="{{item.isSkip}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 24px; background: rgba(255,255,255,0.96); border-top: 1px solid #E1E6E2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #2F6B4F; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg>
      Today
    </a>
    <a href="Plants.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5A665F; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
      Plants
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5A665F; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      Photos
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5A665F; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { logged: {} }; }
  renderVals() {
    var self = this;
    var base = [
      { id: 'pilea', name: 'Pilea', where: 'Living room window', tint: '#DCEBDD', due: 'Overdue 2 days', overdue: true,
        hint: 'Skewer under the pebbles. Water if dry 2–3 cm down.' },
      { id: 'dracaena', name: 'Dracaena', where: 'Bookshelf by the desk lamp', tint: '#E3E9D5', due: 'Today', overdue: false,
        hint: 'Keep lightly moist while rooting. Never soggy.' },
      { id: 'yucca', name: 'Yucca', where: 'TV stand', tint: '#E8E6D6', due: 'Today', overdue: false,
        hint: 'Lift the pot. If it feels light, water until the saucer fills.' },
      { id: 'crassula', name: 'Crassula', where: 'Bedroom window', tint: '#E4ECD9', due: 'Today', overdue: false,
        hint: 'Only water when the soil is fully dry.' }
    ];
    var ST = {
      water: { label: 'Watered', next: 'Next check in 14 days', bg: '#DDF0E2', fg: '#1F5A36' },
      damp: { label: 'Still damp', next: 'Checking again in 3 days', bg: '#FCEFC7', fg: '#6E4B00' },
      skip: { label: 'Skipped', next: 'Back on the list tomorrow', bg: '#FBE1DE', fg: '#9B1C1C' }
    };
    var logged = this.state.logged;
    var items = base.map(function (p) {
      var k = logged[p.id];
      function set(v) { return function () { var n = Object.assign({}, self.state.logged); if (v) { n[p.id] = v; } else { delete n[p.id]; } self.setState({ logged: n }); }; }
      var st = k ? ST[k] : null;
      return Object.assign({}, p, {
        open: !k, done: !!k,
        borderC: (p.overdue && !k) ? '#C53030' : 'transparent',
        dueFg: p.overdue ? '#9B1C1C' : '#1D3E63',
        sLabel: st ? st.label : '', sNext: st ? st.next : '', sBg: st ? st.bg : '#FFFFFF', sFg: st ? st.fg : '#1B241F',
        isWater: k === 'water', isDamp: k === 'damp', isSkip: k === 'skip',
        water: set('water'), damp: set('damp'), skip: set('skip'), undo: set(null)
      });
    });
    var left = items.filter(function (i) { return i.open; }).length;
    return { items: items, summary: left === 0 ? 'All done for today.' : left + ' to check · tap the drop when watered' };
  }
}
</script>
</body>
</html>
